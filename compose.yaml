services:
  # Layanan Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: bottele_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-bottele}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DATABASE_NAME:-botteleabsensi}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bottele} -d ${DATABASE_NAME:-botteleabsensi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Layanan Aplikasi AI Agent Telegram & Monev
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bottele_agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-bottele}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-secretpassword}
      DATABASE_NAME: ${DATABASE_NAME:-botteleabsensi}
      DATABASE_SSLMODE: disable
      TIMEZONE: ${TIMEZONE:-Asia/Jakarta}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

